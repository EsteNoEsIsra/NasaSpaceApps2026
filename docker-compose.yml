services:
  venus-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: venus_health_monitor
    ports:
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    volumes:
      # Mount host directory for real-time hot-reloading across Mac/Win/Linux
      - .:/app
      # Anonymous volume so node_modules from container isn't overridden by host
      - /app/node_modules
    restart: unless-stopped
